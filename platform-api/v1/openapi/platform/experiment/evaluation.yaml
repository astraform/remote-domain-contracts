openapi: 3.0.3
info:
  title: Evaluation Schema
  version: 1.2.3
  description: Canonical evaluation payloads for replay and scenario quality decisions.
paths:
  /api/evaluations:
    get:
      tags:
        - Evaluations
      summary: List stored evaluation reports
      operationId: listReports
      parameters:
        - in: query
          name: scenarioId
          required: false
          schema:
            type: string
        - in: query
          name: verdict
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
        - in: query
          name: runIdLike
          required: false
          schema:
            type: string
        - in: query
          name: manifestLike
          required: false
          schema:
            type: string
        - in: query
          name: generatedAfter
          required: false
          schema:
            type: string
        - in: query
          name: generatedBefore
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Stored evaluation report summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationRunSummary'
  /api/evaluations/{runId}:
    get:
      tags:
        - Evaluations
      summary: Get a stored evaluation report
      operationId: getReport
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stored evaluation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRunReport'
        '404':
          description: Report not found
  /api/evaluations/run:
    post:
      tags:
        - Evaluations
      summary: Evaluate a run bundle
      operationId: evaluate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRunRequest'
      responses:
        '400':
          description: Malformed JSON rejected before decoding; other business-validation errors retain their existing shapes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentIngressError'
        '413':
          description: Request bytes, JSON structure, batch count or serialized record exceeds Experiment admission limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentIngressError'
        '415':
          description: Non-identity request Content-Encoding is unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentIngressError'
        '200':
          description: Evaluation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRunReport'
  /api/evaluations/compare:
    get:
      tags:
        - Evaluations
      summary: Compare two stored evaluation reports
      operationId: compareStoredReports
      parameters:
        - in: query
          name: baselineRunId
          required: true
          schema:
            type: string
        - in: query
          name: candidateRunId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Regression comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegressionDeltaReport'
  /api/evaluations/compare-inline:
    post:
      tags:
        - Evaluations
      summary: Compare two inline evaluation reports
      operationId: compareInline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareInlineRequest'
      responses:
        '400':
          description: Malformed JSON rejected before decoding; other business-validation errors retain their existing shapes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentIngressError'
        '413':
          description: Request bytes, JSON structure, batch count or serialized record exceeds Experiment admission limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentIngressError'
        '415':
          description: Non-identity request Content-Encoding is unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentIngressError'
        '200':
          description: Regression comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegressionDeltaReport'
  /api/evaluations/policy:
    get:
      tags:
        - Evaluations
      summary: Get the active regression policy
      operationId: getPolicy
      responses:
        '200':
          description: Regression policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegressionPolicy'
components:
  schemas:
    ExperimentIngressError:
      type: object
      description: >
        Admission failure before JSON decoding or persistence. Write requests under
        /api/experiments, /api/experiment-runs, /api/simulation-runs,
        /api/evaluations and /api/calibration-observations have a default 16 MiB
        actual-byte limit (EXPERIMENT_INGRESS_MAX_REQUEST_BYTES; range 1..67108864),
        including descendant routes and unknown/chunked lengths. JSON has depth 64
        and 100000 tokens. Evidence batches default to 1000 raw records
        (EXPERIMENT_INGRESS_MAX_BATCH_RECORDS; range 1..10000); each serialized
        UTF-8 record defaults to 1 MiB (EXPERIMENT_INGRESS_MAX_RECORD_BYTES;
        range 1..16777216, no larger than the request limit).
        Complete admission precedes row/file effects; a rejected batch is not
        partially persisted. Non-identity Content-Encoding is rejected.
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [EXPERIMENT_PAYLOAD_TOO_LARGE, INVALID_EXPERIMENT_REQUEST, EXPERIMENT_CONTENT_ENCODING_UNSUPPORTED]
        message:
          type: string
    EvaluateRunRequest:
      type: object
      properties:
        suiteResult:
          type: object
          additionalProperties: true
          description: >-
            Source suite conforming to EvaluationSuiteResult and its nested
            EvaluationScenarioSource and DomainAssessment schemas. The dynamic
            object preserves arbitrary source evidence and the existing Map-shaped
            operation input without generating a separate transport representation.
            This does not establish published SDK evaluation-operation support.
        suiteResultPath:
          type: string
        bundlePath:
          type: string
        baselineRunId:
          type: string
        persist:
          type: boolean
        overwrite:
          type: boolean

    EvaluationSuiteResult:
      type: object
      additionalProperties: true
      required: [runId, scenarios]
      description: >-
        Source execution evidence with optional independently computed domain assessments.
        Execution statuses and arbitrary metrics are retained as evidence and do not
        produce a semantic assessment by themselves. Additional source fields are preserved.
      properties:
        runId:
          type: string
          minLength: 1
          maxLength: 120
        manifestPath:
          type: string
        generatedAt:
          type: string
          format: date-time
        endpoints:
          type: object
          additionalProperties:
            type: string
        domainId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
        assessment:
          $ref: '#/components/schemas/DomainAssessment'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationScenarioSource'

    EvaluationScenarioSource:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          description: Source execution status, distinct from semantic assessment status.
        category:
          type: string
        metrics:
          type: object
          additionalProperties: true
        assessment:
          $ref: '#/components/schemas/DomainAssessment'

    DomainAssessment:
      type: object
      additionalProperties: false
      description: >-
        A domain-owned result supplied by an evaluator. Astraform validates, records
        and compares attributed assessments; it does not execute their business
        scoring rules. evidenceDigest is lowercase SHA-256 of RFC 8785 canonical JSON
        for the entire submitted suite after removing its root assessment and every
        scenarios[].assessment. The digest identifies the decoded JSON source snapshot,
        not the original HTTP or file bytes. JSON number precision follows binary64
        decoding; encode exact wider integers or decimal values as strings. Numbers
        in the decoded snapshot must retain their value through canonicalization.
        It binds all submitted evidence, not authenticated native-ledger authority.
        evidenceRunId must equal the suite runId. A scenario
        assessment must also supply its exact evidenceScenarioId; root assessments
        must omit that field. Non-null normalized scores require scoreSemanticsId and
        declare a domain-defined higher-is-better scale between zero and one.
      required:
        - schemaVersion
        - domainId
        - evaluatorId
        - evaluatorVersion
        - rubricId
        - rubricVersion
        - configurationDigest
        - evidenceRunId
        - evidenceDigest
        - generatedAt
        - status
        - evidenceRefs
      properties:
        schemaVersion:
          type: string
          enum: [domain_assessment.v1]
        domainId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
        evaluatorId:
          type: string
          minLength: 1
          maxLength: 256
        evaluatorVersion:
          type: string
          minLength: 1
          maxLength: 128
        rubricId:
          type: string
          minLength: 1
          maxLength: 256
        rubricVersion:
          type: string
          minLength: 1
          maxLength: 128
        configurationDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 identifying the evaluator's immutable scoring configuration.
        evidenceRunId:
          type: string
          minLength: 1
          maxLength: 120
        evidenceScenarioId:
          type: string
          minLength: 1
          maxLength: 120
        evidenceDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        generatedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EvaluationStatus'
        evidenceRefs:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
        score:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: Optional domain-normalized higher-is-better score, never inferred by the platform.
        scoreSemanticsId:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable identity of the normalization and meaning of the domain score.
        rationale:
          type: string
          maxLength: 16384
        nativeResult:
          type: object
          nullable: true
          additionalProperties: true
          description: Original domain-native result, including native scores and scale when supplied.
        dimensions:
          type: array
          nullable: true
          maxItems: 128
          items:
            $ref: '#/components/schemas/DomainAssessmentDimension'

    DomainAssessmentDimension:
      type: object
      additionalProperties: false
      required: [metricId, status]
      properties:
        metricId:
          type: string
          minLength: 1
          maxLength: 256
        status:
          $ref: '#/components/schemas/EvaluationStatus'
        score:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: Optional higher-is-better normalized score; requires scoreSemanticsId when non-null.
        scoreSemanticsId:
          type: string
          minLength: 1
          maxLength: 256
        rationale:
          type: string
          maxLength: 16384
        nativeResult:
          type: object
          nullable: true
          additionalProperties: true

    CompareInlineRequest:
      type: object
      properties:
        baselineReport:
          $ref: '#/components/schemas/EvaluationRunReport'
        candidateReport:
          $ref: '#/components/schemas/EvaluationRunReport'
        policy:
          $ref: '#/components/schemas/RegressionPolicy'

    EvaluationRunSummary:
      type: object
      properties:
        runId:
          type: string
        schemaVersion:
          type: string
        scenarioId:
          type: string
        manifestPath:
          type: string
        overallVerdict:
          type: string
        overallScore:
          type: number
          format: double
          nullable: true
        scenarioCount:
          type: integer
          format: int32
        generatedAt:
          type: string
          format: date-time

    EvaluationRunReport:
      type: object
      required:
        - schemaVersion
        - run
        - summary
        - scenarioResults
        - generatedAt
      properties:
        schemaVersion:
          type: string
          description: >-
            Report semantics identifier. Stored evaluation.v1 reports retain their
            historical numeric scoring. New evaluation.v2 reports contain attributed
            domain assessments and explicit NOT_ASSESSED or ERROR outcomes.
          example: evaluation.v2
        run:
          $ref: '#/components/schemas/EvaluationRunMetadata'
        summary:
          $ref: '#/components/schemas/EvaluationSummary'
        scenarioResults:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioEvaluationResult'
        assessment:
          $ref: '#/components/schemas/DomainAssessment'
        regression:
          $ref: '#/components/schemas/RegressionDeltaReport'
        generatedAt:
          type: string
          format: date-time
          description: UTC timestamp when evaluation report was produced.

    EvaluationRunMetadata:
      type: object
      required:
        - runId
        - manifestPath
        - generatedAt
      properties:
        runId:
          type: string
          description: Source run identifier.
        manifestPath:
          type: string
          description: Manifest path used for scenario execution.
        generatedAt:
          type: string
          format: date-time
          description: UTC timestamp from source run metadata.
        endpoints:
          type: object
          additionalProperties:
            type: string
          description: Service endpoints used during execution.
        canonicalArtifactRef:
          type: string
          description: Optional pointer to canonical run artifact bundle.
        domainId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
        sourceDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: RFC 8785 canonical evidence digest defined by DomainAssessment.evidenceDigest.

    ScenarioEvaluationResult:
      type: object
      required:
        - scenarioId
        - status
        - dimensionScores
        - overallVerdict
        - overallScore
      properties:
        scenarioId:
          type: string
        status:
          type: string
          description: Source scenario execution status.
          enum: [PASS, FAIL]
        category:
          type: string
        overallVerdict:
          $ref: '#/components/schemas/EvaluationStatus'
        overallScore:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
        rationale:
          type: string
        dimensionScores:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationDimensionScore'
        assessment:
          $ref: '#/components/schemas/DomainAssessment'
        thresholdAnnotations:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationThresholdAnnotation'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationEvidence'

    EvaluationDimensionScore:
      type: object
      required:
        - dimension
        - score
        - verdict
        - confidence
      properties:
        dimension:
          $ref: '#/components/schemas/EvaluationDimension'
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
        verdict:
          $ref: '#/components/schemas/EvaluationStatus'
        confidence:
          $ref: '#/components/schemas/EvaluationConfidence'
        rationale:
          type: string

    EvaluationThresholdAnnotation:
      type: object
      required:
        - key
        - comparator
        - expected
        - actual
        - passed
      properties:
        key:
          type: string
          description: Threshold key identifier.
        comparator:
          type: string
          enum: [GTE, LTE, EQ]
        expected:
          type: number
          format: double
        actual:
          type: number
          format: double
        passed:
          type: boolean
        details:
          type: string

    EvaluationEvidence:
      type: object
      required:
        - kind
        - ref
      properties:
        kind:
          type: string
          description: Evidence type (metric, event, replay, assertion).
        ref:
          type: string
          description: Path or identifier for evidence lookup.
        summary:
          type: string

    EvaluationConfidence:
      type: object
      required:
        - score
        - label
      properties:
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
        label:
          type: string
          enum: [LOW, MEDIUM, HIGH]

    EvaluationSummary:
      type: object
      required:
        - overallVerdict
        - overallScore
        - scenarioCount
        - passedScenarios
        - failedScenarios
      properties:
        overallVerdict:
          $ref: '#/components/schemas/EvaluationStatus'
        overallScore:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
        scenarioCount:
          type: integer
          format: int32
          minimum: 0
        passedScenarios:
          type: integer
          format: int32
          minimum: 0
        failedScenarios:
          type: integer
          format: int32
          minimum: 0
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationDimensionScore'
        rationale:
          type: string
          description: Explains assessment coverage or an unavailable aggregate assessment.
        unassessedScenarios:
          type: integer
          format: int32
          minimum: 0
        errorScenarios:
          type: integer
          format: int32
          minimum: 0

    RegressionDeltaReport:
      type: object
      required:
        - baselineRunId
        - candidateRunId
      properties:
        baselineRunId:
          type: string
        candidateRunId:
          type: string
        overallDelta:
          type: number
          format: double
          nullable: true
        comparisonStatus:
          type: string
          enum: [COMPARABLE, NOT_COMPARABLE]
          description: Matching qualitative verdicts may be comparable with an unavailable numerical delta.
        comparisonReason:
          type: string
        assessmentDimensionDeltas:
          type: array
          items:
            $ref: '#/components/schemas/DomainAssessmentDimensionDelta'
        dimensionDeltas:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationDimensionDelta'
        scenarioDeltas:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioEvaluationDelta'
        thresholdBreaches:
          type: array
          items:
            $ref: '#/components/schemas/RegressionThresholdBreach'

    EvaluationDimensionDelta:
      type: object
      required:
        - dimension
        - delta
      properties:
        dimension:
          $ref: '#/components/schemas/EvaluationDimension'
        delta:
          type: number
          format: double
        baselineScore:
          type: number
          format: double
        candidateScore:
          type: number
          format: double

    ScenarioEvaluationDelta:
      type: object
      required:
        - scenarioId
      properties:
        scenarioId:
          type: string
        verdictChanged:
          type: boolean
        overallDelta:
          type: number
          format: double
          nullable: true
        comparisonStatus:
          type: string
          enum: [COMPARABLE, NOT_COMPARABLE]
          description: Matching qualitative verdicts may be comparable with an unavailable numerical delta.
        comparisonReason:
          type: string
        assessmentDimensionDeltas:
          type: array
          items:
            $ref: '#/components/schemas/DomainAssessmentDimensionDelta'
        dimensionDeltas:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationDimensionDelta'

    DomainAssessmentDimensionDelta:
      type: object
      required: [metricId, comparisonStatus]
      description: >-
        Comparison coverage for every metric ID present in either assessment.
        Matching qualitative verdicts can be comparable without numerical scores.
        A numerical delta requires scores with identical nonblank scoreSemanticsId;
        missing, incompatible or unassessed metrics retain an explicit reason and no
        numerical delta instead of being silently omitted or assigned zero.
      properties:
        metricId:
          type: string
          minLength: 1
          maxLength: 256
        comparisonStatus:
          type: string
          enum: [COMPARABLE, NOT_COMPARABLE]
          description: Matching qualitative verdicts may be comparable with an unavailable numerical delta.
        comparisonReason:
          type: string
        baselineScore:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
        candidateScore:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
        delta:
          type: number
          format: double
          nullable: true
          minimum: -1
          maximum: 1

    RegressionThresholdBreach:
      type: object
      required:
        - key
        - delta
        - threshold
      properties:
        key:
          type: string
        delta:
          type: number
          format: double
        threshold:
          type: number
          format: double
        severity:
          type: string
          enum: [INFO, WARN, FAIL]

    EvaluationDimension:
      type: string
      enum:
        - RISK
        - POLICY
        - FINANCIAL
        - BEHAVIORAL

    EvaluationStatus:
      type: string
      description: Semantic assessment status, independent of source execution status.
      enum:
        - PASS
        - WARN
        - FAIL
        - NOT_ASSESSED
        - ERROR

    RegressionPolicy:
      type: object
      properties:
        policyVersion:
          type: string
        global:
          $ref: '#/components/schemas/RegressionGlobalPolicy'
        scenarios:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RegressionScenarioPolicy'

    RegressionGlobalPolicy:
      type: object
      properties:
        maxOverallRegression:
          type: number
          format: double
        maxDimensionRegression:
          type: number
          format: double
        failOnVerdictRegression:
          type: boolean

    RegressionScenarioPolicy:
      type: object
      properties:
        maxOverallRegression:
          type: number
          format: double
