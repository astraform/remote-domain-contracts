    SimulationRunEvent:
      type: object
      allOf:
        - oneOf:
            - title: Partner exchange admission evidence
              required: [eventType, category, payload]
              properties:
                eventType:
                  type: string
                  enum: [agent-journey.partner-exchange]
                category:
                  type: string
                  enum: [external-interaction]
                payload:
                  $ref: '#/components/schemas/AgentJourneyPartnerExchangePayload'
            - title: Other existing evidence event types
              not:
                required: [eventType]
                properties:
                  eventType:
                    type: string
                    enum: [agent-journey.partner-exchange]
      properties:
        eventId:
          type: string
        agentId:
          type: string
        domainId:
          type: string
        category:
          type: string
        eventType:
          type: string
        simTimeEpochMs:
          type: integer
          format: int64
        correlationId:
          type: string
        source:
          type: string
        outcome:
          type: string
        severity:
          type: string
        payload:
          type: object
          additionalProperties: true
          properties:
            inputEvidence:
              description: >-
                Retained admitted input for a terminal customer Runtime event, after
                Experiment's existing structured redaction. This is not a rendered
                model prompt or partner-private input. sourceDigest identifies the
                original EventInputs canonical-payload UTF-8 bytes before JSONB:
                sorted keys and normalized decimals, not RFC8785, returned JSON or
                redacted export bytes. CAPTURED describes the retained source;
                public content may be redacted. Existing export member checksums
                identify exported bytes. Historical rows may omit inputEvidence;
                they are never backfilled or replaced, including existing explicit
                UNAVAILABLE evidence. Original payload facts and their timestamps
                remain distinct from the event's actual logical execution time.
              allOf:
                - $ref: '../../core/common.yaml#/components/schemas/EventInputEvidence'
            partnerExchange:
              $ref: '#/components/schemas/AgentJourneyPartnerExchangeReference'
            a2aInvocation:
              description: >-
                Retained single-event Runtime invocation evidence with Experiment's
                existing structured redaction. Source digests identify normalized
                pre-redaction source JSON, not the public content or ZIP entry.
                Optional on terminal partner Runtime event projections; historical
                evidence may omit it and is not backfilled. Missing evidence does
                not prove that no exchange occurred. No new accepted customer result
                is manufactured from an unsuccessful partner receipt.
              allOf:
                - $ref: '../../core/common.yaml#/components/schemas/A2aInvocationEvidence'
          description: |
            Event-specific evidence. New agent-journey.partner-exchange events use
            AgentJourneyPartnerExchangePayload and category external-interaction.
            Terminal partner Runtime event projections may include partnerExchange
            and a2aInvocation. The original actor-local causation/correlation remains
            unchanged; partnerExchange adds the initiating customer-decision relation.
            Historical events may lack these members and are not backfilled.

            New agent-journey.coordination-failed events include
            customerCheckpoint: {status: CAPTURED, checkpointId: "<root-event-id>:cursor"}
            when an owner/root-validated Runtime cursor was saved, or
            customerCheckpoint: {status: UNAVAILABLE} when it could not be obtained.
            A captured cursor preserves its actual Runtime status and last accepted state,
            including an initial version-0 state or ACTIVE work; it does not change the
            run's failureCode or establish that in-flight Runtime work was cancelled.
            UNAVAILABLE does not mean an empty state or rejected launch. Historical
            terminal events may omit this member. Terminal replay never backfills or
            replaces the original capture. The checkpoint uses the existing
            astraform.agent-journey-cursor.v1 payload and is included in the export.
    AgentJourneyPartnerExchangeReference:
      type: object
      additionalProperties: false
      description: >-
        Coordinator-owned association on terminal partner Runtime event evidence.
        References the actual customer decision and accepted partner event without
        replacing either actor's original causation. Request intent remains in the
        referenced customer event; the associated invocation contains normalized
        request/receipt evidence. This reference does not establish goal success.
      required: [schemaVersion, customerAgentId, customerEventId, partnerEventId, targetAgentKey]
      properties:
        schemaVersion:
          type: string
          enum: [astraform.partner-exchange.v1]
        customerAgentId:
          type: string
        customerEventId:
          type: string
          format: uuid
        partnerEventId:
          type: string
          format: uuid
        targetAgentKey:
          type: string
    AgentJourneyPartnerExchangePayload:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            disposition:
              type: string
              enum: [RUNTIME_ACCEPTED]
            partnerEventId:
              type: string
              format: uuid
        - properties:
            disposition:
              type: string
              enum: [NOT_DISPATCHED, ACCEPTANCE_UNCERTAIN]
            partnerEventId:
              nullable: true
              not:
                type: string
      description: >-
        Immutable coordinator admission fact for agent-journey.partner-exchange.
        Its event carries the run-local simulated time; request intent remains in
        the referenced customer event and is not duplicated here. RUNTIME_ACCEPTED
        means the existing Runtime command was accepted, not that network delivery,
        a partner reply or the customer's goal is established. NOT_DISPATCHED records
        a bounded intent that was not submitted. ACCEPTANCE_UNCERTAIN preserves an
        unresolved Runtime command outcome and must not be labelled safely unsent
        or successfully delivered. Later causally linked facts may establish a
        disposition without overwriting this record or resending work for evidence.
        Missing historical records remain missing; replay does not fabricate them.
      required:
        - schemaVersion
        - customerAgentId
        - customerEventId
        - partnerEventId
        - targetAgentKey
        - disposition
        - reason
      properties:
        schemaVersion:
          type: string
          enum: [astraform.partner-exchange.v1]
        customerAgentId:
          type: string
        customerEventId:
          type: string
          format: uuid
        partnerEventId:
          type: string
          format: uuid
          nullable: true
          description: Accepted Runtime partner event identity when established; otherwise null.
        targetAgentKey:
          type: string
        disposition:
          type: string
          enum: [RUNTIME_ACCEPTED, NOT_DISPATCHED, ACCEPTANCE_UNCERTAIN]
        reason:
          type: string
          nullable: true
          description: Existing safe admission/failure reason when present; not a raw exception or invented partner reply.
