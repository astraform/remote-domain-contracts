components:
  parameters:
    CatalogAgentId:
      in: path
      name: catalogAgentId
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  schemas:
    ExperimentCreateRequest:
      type: object
      required:
        - experimentId
        - name
      properties:
        experimentId:
          type: string
        name:
          type: string
        description:
          type: string
        domain:
          type: string
        owner:
          type: string
        status:
          type: string
    ExperimentRecord:
      type: object
      required:
        - experimentId
        - name
        - createdAt
        - updatedAt
      properties:
        experimentId:
          type: string
        name:
          type: string
        description:
          type: string
        domain:
          type: string
        owner:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExperimentRunCreateRequest:
      type: object
      required:
        - runId
        - experimentId
      properties:
        runId:
          type: string
        experimentId:
          type: string
        scenarioId:
          type: string
        branchType:
          type: string
        replicateId:
          type: integer
          format: int32
        compareMode:
          type: string
        presetId:
          type: string
        status:
          type: string
        summaryPath:
          type: string
        bundlePath:
          type: string
        startedAtEpochMs:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true
    ExperimentRunUpdateRequest:
      type: object
      properties:
        status:
          type: string
        summaryPath:
          type: string
        bundlePath:
          type: string
        completedAtEpochMs:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true
    ExperimentRunRecord:
      type: object
      required:
        - runId
        - experimentId
        - createdAt
        - updatedAt
      properties:
        runId:
          type: string
        experimentId:
          type: string
        scenarioId:
          type: string
        branchType:
          type: string
        replicateId:
          type: integer
          format: int32
        compareMode:
          type: string
        presetId:
          type: string
        status:
          type: string
        summaryPath:
          type: string
        bundlePath:
          type: string
        evaluationRunId:
          type: string
        startedAtEpochMs:
          type: integer
          format: int64
        completedAtEpochMs:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentJourneyLaunchRequest:
      type: object
      additionalProperties: false
      description: >
        Runtime applies the documented defaults for omitted optional settings. Clients must
        preserve omission when serializing a saved launch: explicitly supplying a setting
        can change the immutable request identity even when its execution value is unchanged.
      required:
        - requestId
        - catalogAgentId
        - catalogRevisionId
        - catalogDefinitionDigest
        - instruction
      allOf:
        - anyOf:
            - not:
                required: [participationPolicy]
            - required: [completionPolicy]
      properties:
        requestId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Caller-owned idempotency identity for this immutable launch body.
        catalogAgentId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Explicit ACTIVE Agent Catalog definition selected for this launch.
        catalogRevisionId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Explicit immutable published revision selected for this launch.
        catalogDefinitionDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Caller-asserted digest of the selected immutable published revision.
        instruction:
          type: string
          minLength: 1
          maxLength: 32000
          description: >
            Durable, exportable evidence content. Leading and trailing Unicode whitespace is
            removed before idempotency, evidence, and execution. Do not include credentials
            or other secrets.
        facts:
          type: object
          additionalProperties: true
          description: >
            Scenario facts supplied to the simulated customer. Defaults to an empty object.
            When domain is selected, the top-level domain member is reserved for the
            read-only provider observation envelope and must not be supplied by the caller.
            When customerReactionIntervalMs is positive, the top-level customerReaction
            member is reserved for the coordinator's timestamped observation envelope.
        initialAgentState:
          type: object
          additionalProperties: true
          description: 'Initial simulated-customer memory. Defaults to {status: NEW}.'
        logicalTimeEpochMs:
          type: integer
          format: int64
          minimum: 0
          description: Runtime uses 0 when omitted; clients must preserve omission for replay.
        logicalHorizonEpochMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Inclusive horizon; must not precede logicalTimeEpochMs or exceed the deployment
            limit. Runtime uses 172800000 when omitted; clients must preserve omission for replay.
        decisionSchedule:
          $ref: '#/components/schemas/AgentJourneyDecisionSchedule'
        customerReactionIntervalMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Simulated interval before the customer considers a partner reply, tool result,
            domain observation or configured one-shot observation. Omitted or zero preserves
            immediate reactions; this is neither a wall-time delay nor an execution-speed setting.
            The first pending observation fixes the reaction timestamp. Further observations and
            decision opportunities arriving before that timestamp are retained for that reaction
            without extending it. Recurring schedules retain their original anchors and model
            follow-ups retain their requested timestamps. An interval longer than the remaining
            run horizon is accepted, but customer work beyond the horizon is not executed.
            The start plus interval must fit a signed 64-bit timestamp. The supplied value is
            frozen in the immutable launch; explicit zero and omission have different request
            identities but identical timing semantics. Positive values with a partner target
            require Runtime deferredPartnerExchangeSupported capability during launch preflight.
        scheduledInputs:
          type: array
          maxItems: 1024
          description: >
            Frozen one-shot observations. Input identities must be unique. Execution orders
            them by logical time, preserving request order for equal timestamps. Future
            observations are not exposed to the customer before their scheduled time.
            Their facts may not contain customerReaction when customerReactionIntervalMs is positive.
          items:
            $ref: '#/components/schemas/AgentJourneyScheduledInput'
        partnerTargetAgentKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
          description: >
            Optional deployment-owned A2A target the customer may choose to contact.
            Runtime preflight resolves and freezes its binding revision; no endpoint or
            credentials belong in this request.
        completionPolicy:
          $ref: '#/components/schemas/AgentJourneyGoalCompletionPolicy'
        participationPolicy:
          type: string
          enum: [THROUGH_HORIZON]
          description: >-
            Opt-in retained participation, independent of completionPolicy goal assessment.
            Requires the bounded GOAL completionPolicy and Runtime retainedParticipationSupported.
            Configured goal achievement is retained without ending participation. FINISH ends
            the current conversation; the customer remains eligible for future configured inputs
            and decision opportunities through the inclusive logical horizon, subject to existing
            execution and safety limits. No activity or model polling is required while idle.
            Omission preserves legacy early stopping and immutable request identity. The value
            is frozen for the run; it does not advance an ordinary partner backend's clock or state.
        domain:
          $ref: '#/components/schemas/AgentJourneyDomainConfiguration'
        toolContexts:
          type: array
          maxItems: 8
          description: >
            Frozen partner-owned customer references, one per granted MCP binding; GOAL profile only.
            Every MCP grant needs a matching context and unused contexts are rejected. No bank record
            is supplied. Runtime adds the selected reference to trusted MCP request metadata; the
            model cannot change it. Host adds this list to partner facts.astraformCustomerContexts.
          items:
            $ref: '#/components/schemas/AgentJourneyToolContext'
        maxPartnerInteractions:
          type: integer
          minimum: 1
          maximum: 10000
          description: >
            Maximum customer-to-partner interactions. Requires partnerTargetAgentKey;
            defaults to 10 when a partner is selected. Admission reserves this many
            customer reply events in addition to the root, scheduled decisions and inputs.
      x-validation: >
        Selecting domain requires completionPolicy.mode GOAL and partnerTargetAgentKey.
        Neither initial facts nor any scheduledInputs facts may contain a top-level domain
        member when domain is selected. Unsupported provider capabilities are rejected by
        preflight before model execution or provider mutation. The accepted domain
        configuration and resolved deployment binding are pinned in the durable run.
    AgentJourneyToolContext:
      type: object
      additionalProperties: false
      required: [bindingKey, contextRef, subjectRef]
      properties:
        bindingKey:
          type: string
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
        contextRef: {type: string, minLength: 1, maxLength: 256}
        subjectRef: {type: string, minLength: 1, maxLength: 256}
    AgentJourneyDomainConfiguration:
      type: object
      additionalProperties: false
      required: [bindingKey, personaConfiguration, workKinds, maxOperations, seed]
      description: >
        Optional existing SDK provider integration for the first single-customer GOAL
        profile. The provider context is agent-scoped. Its explicitly selected native
        profile supports pure state transformations or transactional reference state in
        the provider's database. Runtime preflight resolves the exact deployment-owned
        endpoint and binding revision; neither endpoint nor credentials belong in this
        request. Provider preparation occurs after durable launch acceptance. The platform
        owns autonomous admission of provider work and customer observations; an external
        client does not advance the domain or drive customer turns.
      properties:
        bindingKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
          description: Deployment-owned domain provider alias resolved and pinned at preflight.
        toolContextBindingKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
          description: >
            Required only for remote-domain.native-reference-state.v1; selects an existing
            frozen toolContexts entry for the provider-owned customer. Preparation attaches
            to prepopulated records at the inclusive run start. Pure-state profiles reject
            this field. Accepted reference receipts supply causal version/time guards for
            this customer's MCP and partner reads; neither identity nor guard is model-authored.
        personaConfiguration:
          type: object
          additionalProperties: true
          description: >
            Provider-owned customer/domain configuration, bounded by the complete launch
            request's 262144-byte transport limit. It does not prescribe customer decisions
            or messages. The selected provider validates its supported configuration.
        workKinds:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          description: Requested domain work kinds; preflight requires every kind to be supported by the selected provider.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
        maxOperations:
          type: integer
          minimum: 1
          maximum: 10000
          description: Frozen bound on admitted domain operations for this run; recovery does not reset it.
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Frozen nonnegative seed within the exact I-JSON integer range, supplied unchanged to the provider.
    AgentJourneyGoalCondition:
      type: object
      additionalProperties: false
      required: [pointer, oneOf]
      properties:
        pointer:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^/'
          description: Non-root RFC 6901 pointer, at most 16 segments, into parsed receipt JSON.
        oneOf:
          type: array
          minItems: 1
          maxItems: 16
          description: Non-null scalar alternatives; each serialized JSON value is at most 1024 characters.
          items:
            oneOf:
              - {type: string}
              - {type: number}
              - {type: boolean}
    AgentJourneyGoalCompletionPolicy:
      type: object
      additionalProperties: false
      required: [mode, goalIndex, partnerResponseConditions, requestFactBindings, maxCustomerDecisions, maxWallTimeMs, maxRepeatedExchanges]
      description: >-
        First goal-based profile: one customer, one selected published goal and one
        granted A2A partner. All conditions must match the parsed JSON object in the
        actual a2aReceipt.text; model claims are not evidence. The reply is delivered
        to the customer before normal goal completion. Plain-text/subjective goals
        and time-based completion are not implemented by this policy. Limits stop
        new work admission; already accepted operations reconcile under their
        existing bounded timeouts. No new goal or conversation resets these limits.
      properties:
        mode:
          type: string
          enum: [GOAL]
        goalIndex:
          type: integer
          minimum: 0
          maximum: 31
          description: Zero-based index in the pinned Catalog revision's behavior.goals.
        partnerResponseConditions:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/AgentJourneyGoalCondition'
        requestFactBindings:
          type: array
          maxItems: 32
          description: >-
            Configured structured request fields must equal the latest supplied fact
            at the selected pointer from initial facts and already admitted scheduled
            observations. When domain is selected, pointers at /domain or beneath it
            instead resolve only to the latest accepted provider observation envelope
            in facts.domain. Without domain selected, facts.domain retains ordinary
            caller-supplied fact semantics. Omitted request fields are allowed; null, unknown or
            mismatched supplied values block dispatch without repairing the request.
            Model memory/proposals and future observations cannot establish facts.
            Empty bindings provide no field-grounding protection. Free text is not
            checked by this profile.
          items:
            type: object
            additionalProperties: false
            required: [requestPointer, factPointer]
            properties:
              requestPointer:
                type: string
                minLength: 1
                maxLength: 256
                pattern: '^/'
                description: Unique non-root RFC 6901 pointer into partnerRequest.facts; at most 16 segments.
              factPointer:
                type: string
                minLength: 1
                maxLength: 256
                pattern: '^/'
                description: >-
                  Non-root RFC 6901 pointer into supplied scenario facts; at most 16
                  segments. With domain selected, /domain and its descendants refer
                  exclusively to the latest accepted provider observation envelope.
        maxCustomerDecisions:
          type: integer
          minimum: 1
          maximum: 10000
          description: >-
            Total customer event budget including root and partner replies, bounded by
            deployment maxEventsPerAgent. Each event retains the root's finite retry
            limit; maximum model invocation attempts are this budget times that limit.
            Provider internal retries remain disabled. Current single-customer run and
            customer budgets coincide; this does not implement shared-cohort budgets.
        maxWallTimeMs:
          type: integer
          format: int64
          minimum: 1
          maximum: 604800000
          description: Deadline measured from durable launch acceptance; restart does not reset it. New runs pin it into Runtime so expired unstarted model attempts and unsent partner requests fail without invoking them. Already admitted attempts and started effects settle under their existing timeouts; service outages can delay reconciliation. Older saved runs retain their admission-only policy.
        maxRepeatedExchanges:
          type: integer
          minimum: 1
          maximum: 100
          description: >-
            Stop after this many consecutive identical request/receipt-text pairs
            without goal achievement. This exact-repeat guard is not semantic
            no-progress detection; varying repetitions still hit the total budgets.
    AgentJourneyDecisionSchedule:
      type: object
      additionalProperties: false
      required: [scheduleId, firstOccurrenceEpochMs, intervalMs, maxOccurrences]
      description: >
        Optional fixed elapsed-time decision opportunities, calculated from the immutable
        first occurrence plus ordinal times interval. The first occurrence must be within
        the inclusive run horizon. Admission stops at the earlier of the horizon or
        maxOccurrences, and does not preallocate the full event history. Each opportunity
        permits an LLM decision; it does not prescribe a business action. Omitting this
        schedule selects event-only progression. Calendar recurrence is unsupported.
      properties:
        scheduleId:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank stable schedule identity without surrounding whitespace.
        firstOccurrenceEpochMs:
          type: integer
          format: int64
          minimum: 0
        intervalMs:
          type: integer
          format: int64
          minimum: 1
        maxOccurrences:
          type: integer
          format: int64
          minimum: 1
      x-validation: >
        Timestamps, occurrence arithmetic and aggregate planned work must fit signed 64-bit
        integers. Launch validates the resolved horizon and aggregate planned work against
        the selected runtime deployment limits before accepting the run.
    AgentJourneyScheduledInput:
      type: object
      additionalProperties: false
      required: [inputId, logicalTimeEpochMs, instruction, facts]
      properties:
        inputId:
          type: string
          minLength: 1
          maxLength: 128
          description: Nonblank stable input identity, unique within this launch, without surrounding whitespace.
        logicalTimeEpochMs:
          type: integer
          format: int64
          minimum: 0
          description: Must fall within the inclusive run start and horizon.
        instruction:
          type: string
          minLength: 1
          maxLength: 32000
          description: Nonblank observation instruction, trimmed before freezing and execution.
        facts:
          type: object
          additionalProperties: true
          description: >
            Observed facts supplied only when this input is due; customer actions remain
            model decisions. When the launch selects domain, the top-level domain member
            is reserved for provider observations and must not be supplied here.
    PublicSimulationInputRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, logicalTimeEpochMs, expectedStateVersion, instruction, facts]
      properties:
        idempotencyKey: {type: string, minLength: 1, maxLength: 512}
        logicalTimeEpochMs: {type: integer, format: int64, minimum: 0}
        expectedStateVersion: {type: integer, format: int64, minimum: 0}
        instruction: {type: string, minLength: 1, maxLength: 32000}
        facts: {type: object, additionalProperties: true}
    AgentJourneyLaunchResponse:
