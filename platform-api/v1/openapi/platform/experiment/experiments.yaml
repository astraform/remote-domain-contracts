    AgentJourneyCustomerReactionObservation:
      type: object
      additionalProperties: false
      required: [kind, identity, logicalTimeEpochMs, instruction, facts]
      description: >-
        An admitted observation or decision opportunity collected for one delayed
        customer decision. Its logical timestamp is its original occurrence time,
        not the later customer decision time. DOMAIN_SNAPSHOT preserves the initial
        trigger's older domain observation when facts.domain has been refreshed.
      properties:
        kind:
          type: string
          enum: [OBSERVATION, RECURRENCE, MODEL, DOMAIN_OBSERVATION, TOOL_RESULT, MCP_TOOL_RESULT, DOMAIN_SNAPSHOT]
        identity:
          type: string
          description: Stable identity from the original input, schedule ordinal, model proposal or initial command.
        logicalTimeEpochMs:
          type: integer
          format: int64
          minimum: 0
        instruction:
          type: string
        facts:
          type: object
          additionalProperties: true
          description: Actual facts for this occurrence; not model-generated replacements or future observations.
    AgentJourneyCustomerReactionFacts:
      type: object
      additionalProperties: false
      required: [triggerKind, triggerLogicalTimeEpochMs, readyAtEpochMs, observations]
      description: >-
        Host-owned facts.customerReaction supplied to a delayed customer decision
        when customerReactionIntervalMs is positive. The first trigger fixes readyAtEpochMs;
        further inputs at or before that timestamp are considered together without
        resetting it. The original trigger remains in its ordinary facts fields.
        facts.domain, when present, is the latest admitted provider observation;
        an earlier changed domain snapshot is preserved among observations.
        Actual partner/tool receipts retain their original occurrence time and content.
        No real-time delay or speed multiplier is implied. The initial input plus
        observations must fit 64 inputs and the complete serialized pending envelope
        and final command must each fit 262144 UTF-8 bytes, otherwise execution stops
        with CUSTOMER_REACTION_INPUT_LIMIT without truncating inputs.
        This envelope is an execution/evidence shape, not an allowed caller-supplied
        launch or scheduled-input field when the positive policy is selected.
      properties:
        triggerKind:
          type: string
          enum: [PARTNER_REPLY, OBSERVATION, DOMAIN_OBSERVATION, TOOL_RESULT, MCP_TOOL_RESULT]
        triggerLogicalTimeEpochMs:
          type: integer
          format: int64
          minimum: 0
        readyAtEpochMs:
          type: integer
          format: int64
          minimum: 0
          description: Checked triggerLogicalTimeEpochMs plus the frozen customerReactionIntervalMs; inclusive customer decision time.
        observations:
          type: array
          maxItems: 63
          description: Additional retained inputs/opportunities and any preserved earlier domain snapshot; the initial trigger counts separately.
          items:
            $ref: '#/components/schemas/AgentJourneyCustomerReactionObservation'
    AgentJourneyCustomerReactionProgress:
      type: object
      additionalProperties: false
      required: [status, triggerKind, triggerLogicalTimeEpochMs, pendingInputCount]
      description: >-
        Host-owned summary of the durable pending reaction. SCHEDULED means the customer
        has not yet received its delayed decision; domain progress may already have advanced.
        STOPPED preserves pending-work evidence after an explicit failure/limit.
        For THROUGH_HORIZON participation, OUTSIDE_HORIZON preserves a reaction whose
        readyAtEpochMs is beyond the horizon; it does not invoke the customer or prevent
        HORIZON_COVERED completion. Legacy runs retain CUSTOMER_REACTION_BEYOND_HORIZON
        failure semantics. The trigger, due time and input count remain evidence.
        readyAtEpochMs is absent only when timestamp arithmetic overflowed.
        pendingInputCount includes the initial input and stored additional observations;
        a stopped overflow may exceed the admission bound. It is not a count of LLM calls.
      properties:
        status:
          type: string
          enum: [SCHEDULED, STOPPED, OUTSIDE_HORIZON]
        triggerKind:
          type: string
          enum: [PARTNER_REPLY, OBSERVATION, DOMAIN_OBSERVATION, TOOL_RESULT, MCP_TOOL_RESULT]
        triggerLogicalTimeEpochMs:
          type: integer
          format: int64
          minimum: 0
        readyAtEpochMs:
          type: integer
          format: int64
          minimum: 0
        pendingInputCount:
          type: integer
          minimum: 1
    AgentJourneyGoalProgress:
      type: object
      additionalProperties: false
      required: [schemaVersion, goalIndex, status, deadlineEpochMs, customerDecisions, modelAttempts]
      properties:
        schemaVersion: {type: string, enum: [astraform.goal-progress.v1]}
        goalIndex: {type: integer, minimum: 0, maximum: 31}
        status:
          type: string
          enum: [ACTIVE, ACHIEVED, ABANDONED, BLOCKED, NO_PROGRESS, HORIZON_REACHED, LIMIT_REACHED, TIMED_OUT, EXECUTION_FAILED]
        deadlineEpochMs: {type: integer, format: int64}
        customerDecisions:
          type: integer
          format: int64
          minimum: 0
          description: Settled customer events, including failed events; root and replies count.
        modelAttempts:
          type: integer
          format: int64
          minimum: 0
          description: Settled event attempts; conservative model-call accounting, including attempts that failed before provider invocation.
        maximumModelAttempts:
          type: integer
          format: int64
          minimum: 1
          description: Decision limit times the durable root retry limit inherited by subsequent customer events; available after root projection.
        stopReason: {type: string}
        lastExchangeDigest: {type: string}
        repeatedExchanges: {type: integer, minimum: 1}
        achievementEvidence:
          type: object
          additionalProperties: false
          required: [partnerEventId, customerEventId, receiptDigest, evaluator, matchedConditions]
          description: >-
            Matching receipt awaiting customer-reply settlement while ACTIVE; successful
            completion only when status is ACHIEVED. A later model/execution failure
            remains failure even with a matching receipt.
          properties:
            partnerEventId: {type: string, format: uuid}
            customerEventId: {type: string, format: uuid}
            receiptDigest: {type: string}
            evaluator: {type: string, enum: [astraform.partner-json-conditions.v1]}
            matchedConditions:
              type: array
              items:
                $ref: '#/components/schemas/AgentJourneyGoalCondition'
        rejectedRequest:
          type: object
          additionalProperties: false
          required: [customerEventId, requestPointer, factPointer]
          properties:
            customerEventId: {type: string, format: uuid}
            requestPointer: {type: string}
            factPointer: {type: string}
    AgentJourneyParticipationProgress:
      type: object
      additionalProperties: false
      required: [policy, status, logicalHorizonEpochMs, lastCustomerEventTimeEpochMs]
      description: >-
        Host-owned participation coverage for an opted-in customer, separate from configured
        goal assessment and the latest conversation decision. Omitted for legacy runs.
        lastCustomerEventTimeEpochMs records the latest actual customer event; idle coverage
        never fabricates a Runtime cursor or customer decision. coveredThroughEpochMs is
        present only after completed coverage and equals logicalHorizonEpochMs. Execution
        limits or failures stop participation without claiming horizon coverage.
      allOf:
        - anyOf:
            - required: [coveredThroughEpochMs]
              properties:
                status: {type: string, enum: [COMPLETED]}
            - properties:
                status: {type: string, enum: [ACTIVE, STOPPED]}
              not:
                required: [coveredThroughEpochMs]
      properties:
        policy:
          type: string
          enum: [THROUGH_HORIZON]
        status:
          type: string
          enum: [ACTIVE, COMPLETED, STOPPED]
        logicalHorizonEpochMs:
          type: integer
          format: int64
          minimum: 0
        lastCustomerEventTimeEpochMs:
          type: integer
          format: int64
          minimum: 0
        coveredThroughEpochMs:
          type: integer
          format: int64
          minimum: 0
        stopReason:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,95}$'
      x-validation: >-
        COMPLETED requires coveredThroughEpochMs equal to logicalHorizonEpochMs;
        ACTIVE and STOPPED omit coveredThroughEpochMs. The last actual customer event
        must not exceed the horizon. Terminal status retains the actual stop reason.
    AgentJourneyNativeProgress:
      type: object
      additionalProperties: false
      required: [logicalTimeEpochMs, nextLogicalTimeEpochMs, stopReason]
      description: >-
        Host-owned progress for a coordinated single customer. Customer decision records
        its latest completed decision, not a business-success verdict. While active,
        customer status follows that decision unless a pending customerReaction reports
        SCHEDULED. With ACTIVE THROUGH_HORIZON participation, a latest FINISH projects
        SCHEDULED when another input is pending or WAITING when idle, retaining the actual
        customerDecision FINISH. Under legacy stopping semantics, an explicit stop projects
        STOPPED unless the actual latest decision is FINISH, which retains FINISHED.
        Terminal progress has no next logical boundary. A retained customerReaction reports
        STOPPED after failure/limit or OUTSIDE_HORIZON when its due time exceeds retained
        participation's horizon; its original trigger, due time and input count are preserved.
        Under legacy stopping semantics,
        FINISHED describes participation and can accompany a failed or abandoned goal;
        goal and stopReason retain the result. With participationPolicy THROUGH_HORIZON,
        FINISH closes only the current conversation; participation reports continuing
        eligibility or completed/stopped coverage independently of that decision.
        Finalizers apply this projection only on the first terminal transition. Existing
        terminal records and exports are not rewritten on reads or replay.
        CONTACT_PARTNER waits for the actual reply; CALL_TOOL waits for its actual provider
        result and reports WAITING_FOR_TOOL; SCHEDULE proposes a future decision;
        WAIT resumes on configured observations or decision opportunities. For legacy runs,
        FINISH cancels further customer admission and, without a GOAL completion policy,
        completes with CUSTOMER_FINISHED. GOAL runs retain their assessment and stop reason.
        For legacy runs, WAIT without another configured input/opportunity stops the run as FAILED with
        CUSTOMER_WAITING_NO_FUTURE_INPUT. A sole continuation beyond the horizon stops
        as FAILED with CUSTOMER_CONTINUATION_BEYOND_HORIZON. These represent unfinished
        customer participation. A delayed reaction beyond the horizon stops legacy runs with
        CUSTOMER_REACTION_BEYOND_HORIZON. THROUGH_HORIZON runs retain that reaction as
        OUTSIDE_HORIZON and complete covered participation with HORIZON_COVERED, without
        fabricating a customer event at the horizon. Arithmetic overflow stops with
        CUSTOMER_REACTION_TIME_OVERFLOW; bounded input overflow stops with
        CUSTOMER_REACTION_INPUT_LIMIT. Legacy roots without a frozen decision contract omit
        customerDecision and customerStatus and retain their original stopping rules.
        No missing customer decision or legacy status is synthesized by terminal projection.
      properties:
        participation:
          $ref: '#/components/schemas/AgentJourneyParticipationProgress'
        goal:
          $ref: '#/components/schemas/AgentJourneyGoalProgress'
        customerReaction:
          $ref: '#/components/schemas/AgentJourneyCustomerReactionProgress'
        logicalTimeEpochMs:
          type: integer
          format: int64
          minimum: 0
        nextLogicalTimeEpochMs:
          type: integer
          format: int64
          nullable: true
        stopReason:
          type: string
          nullable: true
          pattern: '^[A-Z][A-Z0-9_]{0,95}$'
        customerDecision:
          type: string
          enum: [CONTACT_PARTNER, CALL_TOOL, SCHEDULE, WAIT, FINISH]
        customerStatus:
          type: string
          enum: [WAITING_FOR_PARTNER, WAITING_FOR_TOOL, SCHEDULED, WAITING, FINISHED, STOPPED]
