        expectedDraftSpecDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Exact digest of the saved draft reviewed by the publisher.
    AgentDefinitionDraft:
      type: object
      description: >
        Partner-authored behavior and separately configured execution/tool permissions.
        Role, purpose, goals, constraints and additionalInstructions use ordinary language
        describing the actor, business objectives, knowledge and behavior. Agent Runtime
        supplies protocol/action formats and result locations from bound capability schemas;
        partners need not embed MCP/A2A wire instructions in persona prose.
      additionalProperties: false
      required:
        - role
        - purpose
        - goals
        - constraints
        - execution
        - tools
      properties:
        role:
          type: string
          minLength: 1
          maxLength: 255
        purpose:
          type: string
          minLength: 1
          maxLength: 4000
        goals:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 1000
        constraints:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 1000
        additionalInstructions:
          type: string
          maxLength: 16000
          description: >
            Additional human-readable behavioral guidance. Capability permissions belong in
            tools and deployment bindings; Runtime owns their execution protocol instructions.
        execution:
          $ref: '#/components/schemas/AgentExecutionBinding'
        tools:
          type: array
          maxItems: 8
          uniqueItems: true
          description: >
            Published read-only DOMAIN or MCP permissions with unique toolName values across all
            grants. DOMAIN grants use one selected domain bindingKey and require that matching
            native GOAL domain in POST /api/agent-journeys. MCP grants may select multiple approved
            MCP bindings and require a customer context for each binding at launch. Empty grants
            preserve existing definitions. Raw simulation-event launches cannot claim a tool-bearing
            Catalog revision. Launch rejects changed binding, provider, descriptor or schema identities
            before admitting execution.
          items:
            $ref: '#/components/schemas/AgentToolGrant'
    AgentToolGrant:
      oneOf:
        - $ref: '#/components/schemas/AgentDomainToolGrant'
        - $ref: '#/components/schemas/AgentMcpToolGrant'
      discriminator:
        propertyName: kind
        mapping:
          DOMAIN: '#/components/schemas/AgentDomainToolGrant'
          MCP: '#/components/schemas/AgentMcpToolGrant'
    AgentDomainToolGrant:
      type: object
      additionalProperties: false
      required:
        - kind
        - bindingKey
        - bindingRevision
        - bindingDigest
        - providerRevision
        - toolName
        - descriptorRevision
        - descriptorDigest
        - inputSchemaDigest
        - outputSchemaDigest
        - effectClass
        - scope
        - maxCalls
      properties:
        kind:
          type: string
          enum: [DOMAIN]
        bindingKey:
          type: string
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
        bindingRevision:
          type: string
          minLength: 1
          maxLength: 256
          description: Exact canonical deployment binding revision from domain discovery.
        bindingDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        providerRevision:
          type: string
          minLength: 1
          maxLength: 128
        toolName:
          type: string
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
        descriptorRevision:
          type: string
          minLength: 1
          maxLength: 128
          description: Exact revision from the selected provider tool descriptor.
        descriptorDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: RFC 8785 digest of the complete provider descriptor, including its description.
        inputSchemaDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        outputSchemaDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        effectClass:
          type: string
          enum: [READ_ONLY]
        scope:
          type: string
          enum: [CUSTOMER_CONTEXT]
          description: Only the accepted domain context of this simulation's customer is accessible.
        maxCalls:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum accepted tool reads for this customer run; retries reuse the same intent.
    AgentMcpToolGrant:
      type: object
      additionalProperties: false
      required:
