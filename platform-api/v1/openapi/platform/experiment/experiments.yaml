        bindingKey:
          type: string
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
        bindingRevision:
          type: string
          minLength: 1
          maxLength: 256
          description: Exact canonical deployment binding revision from MCP discovery.
        bindingDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        toolName:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_.-]{1,128}$'
        descriptorDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: RFC 8785 digest of the pinned MCP tool descriptor, including its description.
        inputSchemaDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        outputSchemaDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        effectClass:
          type: string
          enum: [READ_ONLY]
        scope:
          type: string
          enum: [CUSTOMER_CONTEXT]
          description: Access is bound to this customer's trusted context for the selected MCP binding.
        maxCalls:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum accepted tool reads for this customer run; retries reuse the same intent.
    AgentExecutionBinding:
