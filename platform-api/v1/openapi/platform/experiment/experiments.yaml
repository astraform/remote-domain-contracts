openapi: 3.0.3
info:
  title: Experiment Registry API
  version: 0.1.1
  description: Registry and evidence APIs for experiment definitions, runs, artifacts, source snapshots, and calibration.
servers:
  - url: http://localhost:7457
tags:
  - name: Experiments
    description: Generic experiment registry, run tracking, artifacts, and calibration APIs.
  - name: Scenario Lab
    description: Primary Scenario Lab pack APIs.
  - name: Simulation Runs
    description: Durable simulation run evidence ledger and export APIs.
  - name: Agent Journeys
    description: Launches the runtime-backed isolated Agent Journey product flow.
  - name: Agent Catalog
    description: Authors versioned agent definitions and publishes immutable revisions.
paths:
  /api/experiments:
    get:
      tags:
        - Experiments
      summary: List registered experiments
      operationId: listExperiments
      responses:
        '200':
          description: Registered experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExperimentRecord'
    post:
      tags:
        - Experiments
      summary: Create or upsert an experiment
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreateRequest'
      responses:
        '200':
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentRecord'
  /api/experiments/{experimentId}:
    get:
      tags:
        - Experiments
      summary: Get an experiment by id
      operationId: getExperiment
      parameters:
        - in: path
          name: experimentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Experiment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentRecord'
        '404':
          description: Experiment not found
  /api/experiments/{experimentId}/latest-run:
    get:
      tags:
        - Experiments
      summary: Get the most recent run for an experiment
      operationId: getLatestExperimentRun
      parameters:
        - in: path
          name: experimentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest experiment run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentRunRecord'
        '404':
          description: No run found for experiment
  /api/scenario-lab/packs:
    get:
      tags:
        - Scenario Lab
      summary: List available Scenario Lab packs
      operationId: listScenarioLabPacks
      responses:
        '200':
          description: Scenario Lab pack catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabPackCatalog'
  /api/scenario-lab/packs/{packId}:
    get:
      tags:
        - Scenario Lab
      summary: Get Scenario Lab pack details
      operationId: getScenarioLabPack
      parameters:
        - in: path
          name: packId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario Lab pack detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabPack'
        '404':
          description: Scenario Lab pack not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
  /api/scenario-lab/packs/{packId}/presets:
    get:
      tags:
        - Scenario Lab
      summary: Load a Scenario Lab pack preset catalog
      operationId: getScenarioLabPackPresets
      parameters:
        - in: path
          name: packId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario Lab pack preset catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabPresetCatalog'
        '404':
          description: Scenario Lab pack not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
  /api/scenario-lab/packs/{packId}/runs:
    post:
      tags:
        - Scenario Lab
      summary: Start an async Scenario Lab run
      operationId: startScenarioLabPackRun
      parameters:
        - in: path
          name: packId
          required: true
          schema:
            type: string
        - in: header
          name: X-Astraform-Execution-Role
          required: false
          schema:
            type: string
          description: Optional execution role used for Team Operator vs Platform Admin validation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioLabRunStartRequest'
      responses:
        '202':
          description: Async Scenario Lab run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabRunStatus'
        '400':
          description: Invalid Scenario Lab request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
        '404':
          description: Scenario Lab pack not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
        '500':
          description: Failed to start the Scenario Lab run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
  /api/scenario-lab/packs/{packId}/runs/{runId}:
    get:
      tags:
        - Scenario Lab
      summary: Get async Scenario Lab run status
      operationId: getScenarioLabPackRunStatus
      parameters:
        - in: path
          name: packId
          required: true
          schema:
            type: string
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario Lab run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabRunStatus'
        '400':
          description: Invalid Scenario Lab run id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
        '404':
          description: Scenario Lab run or pack not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
        '500':
          description: Failed to read Scenario Lab run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
  /api/scenario-lab/packs/{packId}/runs/{runId}/lifecycle:
    post:
      tags:
        - Scenario Lab
      summary: Control a Scenario Lab run lifecycle
      operationId: controlScenarioLabPackRun
      parameters:
        - in: path
          name: packId
          required: true
          schema:
            type: string
        - in: path
          name: runId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioLabRunControlRequest'
      responses:
        '200':
          description: Scenario Lab lifecycle control accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabRunStatus'
        '400':
          description: Invalid lifecycle control request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
        '404':
          description: Scenario Lab run or pack not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
        '409':
          description: Lifecycle action is not supported for this run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
        '500':
          description: Failed to control the Scenario Lab run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioLabApiError'
  /api/experiment-runs:
    post:
      tags:
        - Experiments
      summary: Create an experiment run
      operationId: createExperimentRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentRunCreateRequest'
      responses:
        '200':
          description: Experiment run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentRunRecord'
  /api/experiment-runs/{runId}:
    get:
      tags:
        - Experiments
      summary: Get an experiment run
      operationId: getExperimentRun
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Experiment run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentRunRecord'
        '404':
          description: Run not found
    patch:
      tags:
        - Experiments
      summary: Update an experiment run
      operationId: updateExperimentRun
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentRunUpdateRequest'
      responses:
        '200':
          description: Experiment run updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentRunRecord'
        '404':
          description: Run not found
  /api/simulation-events:
    post:
      tags: [Simulation Events]
      operationId: submitPublicSimulationEvent
      summary: Launch a durable customer MODEL or partner A2A event
      description: >
        Deployment-bound runtime gateway for scripted simulations. Does not create
        Agent Journey jobs or project events into the Experiment Evidence Ledger.
        MODEL represents the simulated customer; an A2A target represents the partner system under test.
        Model endpoints, target URLs, and credentials are configured by the deployment, never this request.
        Catalog provenance is optional but requires all four fields when supplied. The gateway verifies
        owner, revision, definition digest, display name, model binding, compiled instruction, and instruction
        digest against the immutable published revision; mismatches return 409 before Runtime submission.
        Publication remains verifiable after archival; raw MODEL definitions without Catalog provenance are supported.
        Tool-bearing Catalog revisions require the tracked /api/agent-journeys domain preflight;
        this raw route returns SIMULATION_EVENT_DOMAIN_TOOLS_REQUIRE_JOURNEY rather than dropping their grants.
      requestBody:
        required: true
        description: Strict JSON object limited to 262144 UTF-8 wire bytes.
        content:
          application/json:
            schema:
              $ref: '../../core/common.yaml#/components/schemas/SimulationEventLaunchRequest'
      responses:
        '202':
          description: Event durably accepted or identical command replayed.
          content:
            application/json:
              schema:
                $ref: '../../core/common.yaml#/components/schemas/SimulationEventLaunchResponse'
        '400':
          description: Invalid command or binding configuration.
        '409':
          description: Idempotency, durable agent-state, or Catalog publication provenance conflict.
        '413':
          description: Request exceeds 262144 wire bytes.
        '503':
          description: Delivery cannot be confirmed. Retry with identical body and idempotency key.
    get:
      tags: [Simulation Events]
      operationId: listPublicSimulationEvents
      summary: Read a durable agent cursor and ordered event page
      parameters:
        - {name: runId, in: query, required: true, schema: {type: string, maxLength: 512}}
        - {name: agentId, in: query, required: true, schema: {type: string, maxLength: 512}}
        - {name: afterEventSequence, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Runtime cursor and event page; not an Experiment Evidence Ledger page.
          content:
            application/json:
              schema:
                $ref: '../../core/common.yaml#/components/schemas/SimulationAgentJourney'
        '400':
          description: Invalid owner or pagination.
        '404':
          description: Runtime agent not found.
        '503':
          description: Runtime unavailable.
  /api/simulation-events/mcp-capabilities:
    get:
      tags: [Simulation Events]
      operationId: inspectPublicCustomerMcpCapabilities
      summary: Discover deployment-bound MCP tools for customer grants
      description: >
        Uses official MCP tools/list to resolve the configured binding and explicit allowlist.
        Returns pinned descriptor/schema identities without endpoint or credentials.
        The dashboard proxy exposes /api/dashboard/simulation-events/mcp-capabilities.
      parameters:
        - name: bindingKey
          in: query
          required: true
          schema: {type: string, maxLength: 128, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'}
      responses:
        '200':
          description: Pinned allowed MCP tools.
          content:
            application/json:
              schema:
                $ref: '../../core/common.yaml#/components/schemas/CustomerMcpCapabilities'
        '400': {description: Invalid binding or unsupported tool policy.}
        '409': {description: 'Binding or tool descriptor is unavailable, changed or unsupported.'}
        '503': {description: Runtime or MCP server is unavailable.}
  /api/simulation-events/domain-capabilities:
    get:
      tags: [Simulation Events]
      operationId: inspectPublicNativeDomainCapabilities
      summary: Discover pinned domain descriptors for customer tool grants
      description: >
        Reads the deployment-selected provider without preparing a customer or executing work.
        Returns Runtime's exact capability identities and supported read-only tool descriptors.
        Copy the selected binding/provider/descriptor/schema identities into a Catalog tool grant;
        publication freezes that permission and launch checks the pins again. This response contains
        no provider URL or credentials. Dashboard exposes the same response at
        /api/dashboard/simulation-events/domain-capabilities.
      parameters:
        - name: domainBindingKey
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
      responses:
        '200':
          description: Deployment-bound native domain and tool descriptors.
          content:
            application/json:
              schema:
                $ref: '../../core/common.yaml#/components/schemas/NativeDomainCapabilities'
        '400':
          description: Invalid registry key or unsupported provider profile.
        '404':
          description: Domain binding not configured.
        '503':
          description: Runtime or provider unavailable.
  /api/simulation-events/{eventId}:
    get:
      tags: [Simulation Events]
      operationId: getPublicSimulationEvent
      summary: Read durable event status and its current agent cursor
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Event status.
          content:
            application/json:
              schema:
                $ref: '../../core/common.yaml#/components/schemas/SimulationEventStatusResponse'
        '404':
          description: Event not found.
        '503':
          description: Runtime unavailable.
  /api/simulation-events/{eventId}/inputs:
    post:
      tags: [Simulation Events]
      operationId: submitPublicSimulationInput
      summary: Append external input to a completed event's existing agent
      description: >
        Continues the frozen agent definition and durable state with optimistic state-version
        checking. Input command retries require the same idempotency key and body.
        Remote A2A side effects are not guaranteed exactly once.
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        description: Strict JSON object limited to 262144 UTF-8 wire bytes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicSimulationInputRequest'
      responses:
        '202':
          description: Input durably accepted or identical input replayed.
          content:
            application/json:
              schema:
                $ref: '../../core/common.yaml#/components/schemas/SimulationEventLaunchResponse'
        '400':
          description: Invalid input fields or logical time.
        '404':
          description: Preceding event not found.
        '409':
          description: Stale state version, active work, or idempotency conflict.
        '413':
          description: Request exceeds 262144 wire bytes.
        '503':
          description: Delivery cannot be confirmed. Retry identical input.
  /api/agent-journeys:
    post:
      tags:
        - Agent Journeys
      summary: Launch a durable customer journey with optional autonomous event progression
      description: >
        One accepted launch owns subsequent customer, partner and optional domain progression.
        Domain preflight validates the deployment binding and supported capabilities before
        model execution or provider mutation. A 202 response confirms durable acceptance,
        not successful provider preparation; preparation and later failures are recorded in
        run status and evidence. Due provider logical boundaries are applied before their
        observations are delivered to the customer.
      operationId: launchAgentJourney
      requestBody:
        required: true
        description: The UTF-8 JSON request body is limited to 262144 wire bytes before deserialization.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentJourneyLaunchRequest'
      responses:
        '202':
          description: The launch intent was durably queued or an exact prior request was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentJourneyLaunchResponse'
        '400':
          description: The request is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentJourneyApiError'
        '404':
          description: The requested Agent Catalog definition or revision does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentJourneyApiError'
        '409':
          description: The request conflicts with an immutable replay or the requested Catalog revision is not launchable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentJourneyApiError'
        '413':
          description: The UTF-8 JSON request body exceeds the 262144-byte transport limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentJourneyApiError'
        '415':
          description: The request body is not application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentJourneyApiError'
        '503':
          description: Runtime preflight is temporarily unavailable; retry the same request identity and body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentJourneyApiError'
  /api/agent-definitions:
    get:
      tags:
        - Agent Catalog
      summary: List Agent Catalog definitions
      operationId: listAgentDefinitions
      responses:
        '200':
          description: Agent definitions ordered by display name and identity.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentDefinitionView'
    post:
      tags:
        - Agent Catalog
      summary: Create an Agent Catalog definition idempotently
      operationId: createAgentDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinitionCreateRequest'
      responses:
        '201':
          description: A new draft definition was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionCreateResult'
        '200':
          description: The exact prior create request was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionCreateResult'
        '400':
          description: The request is invalid or contains unsupported fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '409':
          description: The request identity or agent key conflicts with durable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '413':
          description: The request body exceeds the 512 KiB Agent Catalog wire limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '415':
          description: The request body is not JSON or a structured-syntax JSON media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
  /api/agent-definitions/{catalogAgentId}:
    get:
      tags:
        - Agent Catalog
      summary: Get an Agent Catalog definition
      operationId: getAgentDefinition
      parameters:
        - $ref: '#/components/parameters/CatalogAgentId'
      responses:
        '200':
          description: Agent definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionView'
        '400':
          description: catalogAgentId is not a canonical lowercase UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '404':
          description: Agent definition not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
  /api/agent-definitions/{catalogAgentId}/draft:
    put:
      tags:
        - Agent Catalog
      summary: Replace an Agent Catalog draft using optimistic concurrency
      operationId: updateAgentDefinitionDraft
      parameters:
        - $ref: '#/components/parameters/CatalogAgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinitionDraftUpdateRequest'
      responses:
        '200':
          description: Updated draft definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionView'
        '400':
          description: The request is invalid or contains unsupported fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '404':
          description: Agent definition not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '409':
          description: The expected draft version is stale or the definition is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '413':
          description: The request body exceeds the 512 KiB Agent Catalog wire limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '415':
          description: The request body is not JSON or a structured-syntax JSON media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
  /api/agent-definitions/{catalogAgentId}/publish:
    post:
      tags:
        - Agent Catalog
      summary: Publish the current draft as an immutable revision
      operationId: publishAgentDefinition
      parameters:
        - $ref: '#/components/parameters/CatalogAgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinitionPublishRequest'
      responses:
        '201':
          description: An immutable revision was published and made default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionPublishResult'
        '200':
          description: The current draft version was already published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionPublishResult'
        '400':
          description: The request is invalid, incomplete, or contains unsupported fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '404':
          description: Agent definition not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '409':
          description: The Agent Catalog definition is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '412':
          description: The saved draft version or digest no longer matches the publish request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '413':
          description: The request body exceeds the 512 KiB Agent Catalog wire limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '415':
          description: The request body is not JSON or a structured-syntax JSON media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
  /api/agent-definitions/{catalogAgentId}/default-revision:
    put:
      tags:
        - Agent Catalog
      summary: Select the default immutable revision
      operationId: setDefaultAgentDefinitionRevision
      parameters:
        - $ref: '#/components/parameters/CatalogAgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinitionDefaultRevisionRequest'
      responses:
        '200':
          description: Agent definition with its selected default revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionView'
        '400':
          description: The request or path identity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '404':
          description: Agent definition or revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '409':
          description: The revision belongs to another definition or the definition is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '413':
          description: The request body exceeds the 512 KiB Agent Catalog wire limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '415':
          description: The request body is not JSON or a structured-syntax JSON media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
  /api/agent-definitions/{catalogAgentId}/archive:
    post:
      tags:
        - Agent Catalog
      summary: Archive an Agent Catalog definition without deleting history
      operationId: archiveAgentDefinition
      parameters:
        - $ref: '#/components/parameters/CatalogAgentId'
      responses:
        '200':
          description: Archived definition; repeated requests are idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinitionView'
        '400':
          description: catalogAgentId is not a canonical lowercase UUID or a body was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalogApiError'
        '404':
