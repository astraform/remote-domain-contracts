          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        catalogAgentId:
          type: string
          format: uuid
        catalogRevisionId:
          type: string
          format: uuid
        catalogDefinitionDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        displayName:
          type: string
